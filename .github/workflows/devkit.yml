name: devkit

# Packs the Android SDK jar and the libraries of the assistant module, so the code can be compile-checked quickly.
on:
  push:
    paths:
      - ".github/workflows/devkit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve libraries (and compile once)
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :assistant:compileReleaseKotlin --no-daemon > compile.log 2>&1 || true
          tail -120 compile.log

      - name: LiteRT-LM versions and their Java bytecode level
        run: |
          set +e
          mkdir -p kit/litertlm
          M=https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android
          curl -sSL "$M/maven-metadata.xml" -o kit/litertlm/maven-metadata.xml
          cat kit/litertlm/maven-metadata.xml
          for v in $(grep -o '<version>[^<]*</version>' kit/litertlm/maven-metadata.xml | sed -E 's#</?version>##g' | tail -14); do
            curl -sSL "$M/$v/litertlm-android-$v.aar" -o /tmp/l.aar || continue
            rm -rf /tmp/l && mkdir -p /tmp/l && unzip -q -o /tmp/l.aar classes.jar -d /tmp/l || continue
            c=$(unzip -Z1 /tmp/l/classes.jar | grep '\.class$' | head -1)
            unzip -p /tmp/l/classes.jar "$c" | head -c 8 | od -An -tu1 | awk -v v="$v" '{print v, "class major", $7*256+$8}' | tee -a kit/litertlm/versions.txt
            cp /tmp/l/classes.jar "kit/litertlm/litertlm-android-$v.jar"
          done

      - name: Pack
        run: |
          set -x
          mkdir -p kit
          ls "$ANDROID_HOME/platforms"
          cp "$ANDROID_HOME/platforms/android-35/android.jar" kit/android.jar
          for d in com.squareup.okhttp3 com.squareup.okio org.jetbrains.kotlin org.jetbrains org.jetbrains.kotlinx com.google.ai.edge.litertlm; do
            find ~/.gradle/caches/modules-2/files-2.1/$d -name "*.jar" ! -name "*sources*" 2>/dev/null | grep -E "okhttp-4|okio-jvm|kotlin-stdlib-2|annotations-1|annotations-2|kotlinx-coroutines-core-jvm|kotlinx-coroutines-android|litertlm" | while read f; do cp "$f" kit/; done
          done
          find ~/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.litertlm -type f | tee kit/litertlm-files.txt
          find ~/.gradle/caches -path "*transformed*" -name "*.so" | grep -i litert | head -40 | tee kit/litertlm-native.txt
          find ~/.gradle/caches -name "classes.jar" -path "*transformed*" | while read f; do
            n=$(echo "$f" | sed -E 's#.*/transformed/([^/]+)/.*#\1#')
            cp "$f" "kit/aar-$n.jar"
          done
          find assistant/build -name "R.jar" -exec cp {} kit/R.jar \; || true
          cp compile.log kit/ || true
          ls -la kit
          cd kit && zip -q ../devkit.zip *

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: devkit
          name: devkit
          body: Development kit (Android SDK jar + libraries) used to compile-check the code.
          files: devkit.zip
          prerelease: true
          make_latest: false
