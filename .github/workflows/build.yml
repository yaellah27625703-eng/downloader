name: Build APK

on:
  push:
    paths-ignore:
      - "assistant/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: sherpa-onnx native libraries (voice separation + voice fingerprints on the phone)
        run: |
          set -e
          V=v2.0.3
          curl -sSLf --retry 5 -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$V/sherpa-onnx-$V-android.tar.bz2"
          echo "2a30b222abae6d5cf544df4a1c27944279449c25dbb9c755097189cb45db1df0  sherpa.tar.bz2" | sha256sum -c -
          tar xjf sherpa.tar.bz2 ./jniLibs/arm64-v8a/libonnxruntime.so ./jniLibs/arm64-v8a/libsherpa-onnx-c-api.so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mv jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          rm -rf jniLibs sherpa.tar.bz2
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/*.apk Downloader.apk

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-${{ github.run_number }}
          name: failed build ${{ github.run_number }}
          files: build.log
          prerelease: true
          make_latest: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Downloader-APK
          path: Downloader.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مدير التنزيلات - إصدار ${{ github.run_number }}
          body: حمّل ملف Downloader.apk من الأسفل وثبّته على هاتفك.
          files: Downloader.apk
          make_latest: true
