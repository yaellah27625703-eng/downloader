name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/*.apk Downloader.apk

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-${{ github.run_number }}
          name: failed build ${{ github.run_number }}
          files: build.log
          prerelease: true
          make_latest: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Downloader-APK
          path: Downloader.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مدير التنزيلات - إصدار ${{ github.run_number }}
          body: حمّل ملف Downloader.apk من الأسفل وثبّته على هاتفك.
          files: Downloader.apk
          make_latest: true
